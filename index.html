<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- viewport-fit + user-scalable so pinch zoom still works for a low-vision user -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RISE Fibre Door Tracker</title>
<meta name="description" content="Simple door-to-door tracker for RISE Fibre canvassing.">
<meta name="theme-color" content="#C4380F">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iOS: run full screen with no browser bar once added to the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Door Tracker">
</head>
<body>
  <!-- Fixed top bar: back button on the left, screen name in the middle -->
  <header class="topbar" id="topbar">
    <button type="button" class="btn-back" id="backBtn" hidden>
      <span class="ico" aria-hidden="true">&#8592;</span><span>Back</span>
    </button>
    <h1 class="topbar-title" id="topTitle">RISE Fibre</h1>
  </header>

  <!-- Every screen is rendered into here. Tap-only navigation, no gestures. -->
  <main id="app" class="screen" tabindex="-1"></main>

  <!-- Confirmation dialog, used before anything destructive -->
  <div class="modal-wrap" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Are you sure?</h2>
      <p id="modalBody"></p>
      <button type="button" class="btn btn-danger" id="modalYes">
        <span class="ico" aria-hidden="true">&#10004;</span><span id="modalYesText">Yes</span>
      </button>
      <button type="button" class="btn btn-plain" id="modalNo">
        <span class="ico" aria-hidden="true">&#10006;</span><span>No, go back</span>
      </button>
    </div>
  </div>

  <!-- Brief "Saved" confirmation after a change -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data-packages.js"></script>
  <script src="js/data-lists.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
